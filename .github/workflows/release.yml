name: Validate and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check secrets in full history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 git --redact --no-banner --log-opts="--all" .
      - name: Check shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Check release files when present
        run: |
          if [[ -e VERSION || -e RELEASE.md ]]; then
            bash scripts/check-release.sh
          fi

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! -e VERSION && ! -e RELEASE.md ]]; then
            echo "No release prepared."
            exit 0
          fi
          bash scripts/check-release.sh
          version="$(cat VERSION)"
          tag="v$version"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already published."
              exit 0
            fi
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $tag points to another commit; refusing publication." >&2
              exit 1
            fi
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file RELEASE.md